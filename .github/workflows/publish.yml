name: SpidPost Publish

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: spidpost-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    env:
      TZ: America/Sao_Paulo
      npm_config_build_from_source: true

    steps:
      - name: 1. Checkout do codigo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: 3. Instalar FFmpeg e build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg build-essential python3
          ffmpeg -version | head -1
          gcc --version | head -1

      - name: 4. Instalar dependencias (sem scripts)
        run: npm ci --ignore-scripts

      - name: 5. Compilar modulos nativos do zero
        run: |
          echo "=== A compilar better-sqlite3 de fonte ==="
          npm rebuild better-sqlite3 --build-from-source --verbose 2>&1 | tail -30
          echo ""
          echo "=== A compilar libsodium de fonte ==="
          npm rebuild libsodium --build-from-source 2>&1 | tail -10 || echo "libsodium sem native (ok)"

      - name: 6. Verificar binario Linux
        run: |
          echo "=== Ficheiros em build/Release ==="
          ls -la node_modules/better-sqlite3/build/Release/ || echo "PASTA NAO EXISTE"
          echo ""
          echo "=== Tipo de ficheiro ==="
          file node_modules/better-sqlite3/build/Release/better_sqlite3.node || echo "BINARIO NAO EXISTE"
          echo ""
          echo "=== Teste SQLite ==="
          node -e "const D=require('better-sqlite3'); const db=new D(':memory:'); db.exec('CREATE TABLE t(x)'); db.prepare('INSERT INTO t VALUES (?)').run(42); console.log('SQLite OK:', db.prepare('SELECT x FROM t').get())"

      - name: 7. Criar ficheiro .env
        run: |
          cat > .env << 'EOF'
          NODE_ENV=production
          ML_CLIENT_ID=${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET=${{ secrets.ML_CLIENT_SECRET }}
          ML_REDIRECT_URI=${{ secrets.ML_REDIRECT_URI }}
          ML_USER_ID=${{ secrets.ML_USER_ID }}
          ML_ACCESS_TOKEN=${{ secrets.ML_ACCESS_TOKEN }}
          ML_REFRESH_TOKEN=${{ secrets.ML_REFRESH_TOKEN }}
          META_APP_ID=${{ secrets.META_APP_ID }}
          META_APP_SECRET=${{ secrets.META_APP_SECRET }}
          IG_USER_ID=${{ secrets.IG_USER_ID }}
          IG_USERNAME=${{ secrets.IG_USERNAME }}
          PAGE_ID=${{ secrets.PAGE_ID }}
          PAGE_TOKEN=${{ secrets.PAGE_TOKEN }}
          USER_TOKEN_LONGO=${{ secrets.USER_TOKEN_LONGO }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SHEETS_ID=${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_DRIVE_FOLDER_ID=${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_KEY_FILE=/tmp/google-key.json
          IMAGEKIT_URL_ENDPOINT=${{ secrets.IMAGEKIT_URL_ENDPOINT }}
          IMAGEKIT_PUBLIC_KEY=${{ secrets.IMAGEKIT_PUBLIC_KEY }}
          IMAGEKIT_PRIVATE_KEY=${{ secrets.IMAGEKIT_PRIVATE_KEY }}
          PUBLIC_VIDEO_BASE_URL=${{ secrets.PUBLIC_VIDEO_BASE_URL }}
          LIMITE_DIARIO=15
          MINUTOS_APERTADO=60
          EOF

      - name: 8. Escrever chave Google
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_KEY_JSON }}' > /tmp/google-key.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/google-key.json')); console.log('JSON valido')"

      - name: 9. Correr publisher
        run: npm run publish

      - name: 10. Commit data.db atualizado
        run: |
          git config user.name "spidpost-bot"
          git config user.email "bot@spidpost.local"
          git add data.db
          if git diff --cached --quiet; then
            echo "data.db sem alteracoes"
          else
            git commit -m "chore: atualiza data.db [skip ci]"
            git push
            echo "data.db commitado"
          fi
